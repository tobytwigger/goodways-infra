services:


  # ─────────────────────────────────────────────────────────────
  # POSTGRESQL
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:17-3.5-alpine
    # Matches your existing Coolify resource image.
    # Pinned to major version, alpine for smaller footprint.
    labels:
      - "app.name=postgres"

    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      # Set all three in Coolify's environment variables UI.
      # These match the variable names Laravel uses by default
      # so you can reference the same values in your API's env.

      PGDATA: /var/lib/postgresql/data/pgdata
      # Explicit data directory inside the mount point.
      # Avoids a Postgres quirk where it refuses to start if the
      # mounted volume directory contains unexpected files.

    ports:
      - "127.0.0.1:5432:5432"
      # Loopback only — Postgres should never be publicly accessible.
      # Laravel connects via the internal Docker network using the
      # container name "postgres", not this host port.

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Persists your database across redeployments.
      # This is the critical volume — back this up regularly.

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      # pg_isready checks that Postgres is accepting connections.
      # The exporter below waits for this before starting.
      # retries: 5 because Postgres can take a moment on first boot
      # to initialise the data directory.

    networks:
      - postgres_network
      - coolify


  # ─────────────────────────────────────────────────────────────
  # POSTGRES EXPORTER
  # Exposes PostgreSQL metrics in Prometheus format on port 9187.
  # Alloy (running with host networking on the same server) scrapes
  # localhost:9187 and ships metrics to Grafana Cloud.
  # Connects to the postgres container via the shared postgres_network.
  # Docs: https://github.com/prometheus-community/postgres_exporter
  # ─────────────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
      # Connects directly to the postgres container via the shared
      # postgres_network, using the service name as the hostname.

      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      # Automatically discovers and monitors all databases in the instance,
      # not just the one in DATA_SOURCE_NAME.

    ports:
      - "127.0.0.1:9187:9187"
      # Loopback only. Alloy scrapes this on localhost:9187.

    networks:
      - postgres_network
      - coolify


networks:
  postgres_network:
    driver: bridge
    # Isolated network for Postgres and its exporter.
    # Your Laravel API should be added to this network if it connects
    # via container name rather than the host port binding above.
    # See note below on connecting Laravel.
  coolify:
    external: true

volumes:
  postgres_data:
    driver: local