services:

  # ─────────────────────────────────────────────────────────────
  # POSTGRES EXPORTER
  # Exposes PostgreSQL metrics in Prometheus format on port 9187.
  # Alloy (running with host networking on the same server) scrapes
  # localhost:9187 and ships metrics to Grafana Cloud.
  # Connects to the PostgreSQL instance running on the host machine.
  # Docs: https://github.com/prometheus-community/postgres_exporter
  # ─────────────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@host-gateway:5432/${DB_DATABASE}?sslmode=disable"
      # "host-gateway" resolves to the Docker host IP, allowing the
      # exporter to reach the PostgreSQL instance running outside Docker.

      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      # Automatically discovers and monitors all databases in the instance,
      # not just the one in DATA_SOURCE_NAME.

    ports:
      - "127.0.0.1:9187:9187"
      # Loopback only. Alloy scrapes this on localhost:9187.

    extra_hosts:
      - "host-gateway:host-gateway"
      # Adds a host entry resolving "host-gateway" to the Docker host IP.
      # This is what allows the container to reach host-bound services.


    networks:
      coolify:
        external: true

      