services:
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: alloy
    restart: unless-stopped
    labels:
      - "app.name=alloy"

    # ── Resource ceiling (observability is sacrificial) ──────────
    # Under host memory pressure the kernel kills Alloy before the DBs /
    # API (which keep the default score of 0). Alloy buffers telemetry to
    # its WAL, so losing it just drops some in-flight logs/metrics/traces —
    # never application data. Sized for an 8GB host.
    oom_score_adj: 800
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

    network_mode: host
    # Host networking is required so Alloy can:
    # 1. Receive traces on localhost:4317/4318 from your Laravel/Nuxt apps
    # 2. Scrape metrics from Redis/Postgres exporters on their localhost ports
    # Without this, those localhost ports belong to other containers,
    # not to Alloy.

    volumes:
      - ./config:/etc/alloy
      # Git-tracked config from this repo.

      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Alloy reads Docker log files directly from this host path.
      # :ro — read only, Alloy never needs to write here.

      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker socket — lets Alloy discover running containers and
      # read their metadata (name, labels, etc.) to apply as log labels.
      # :ro — Alloy only needs to query, not control Docker.

      - alloy_data:/var/lib/alloy
      # Persistent storage for Alloy's WAL (write-ahead log) and
      # position files. Without this, Alloy would re-send all logs
      # from scratch on every restart.

    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      # Port 12345 is Alloy's own UI — useful for debugging.
      # Accessible via SSH tunnel: ssh -L 12345:localhost:12345 user@server

    environment:
      ALLOY_SERVER_NAME: ${ALLOY_SERVER_NAME}
      ALLOY_ENV: ${ALLOY_ENV}
      LOKI_URL: ${LOKI_URL}
      LOKI_USER: ${LOKI_USER}
      TEMPO_URL: ${TEMPO_URL}
      TEMPO_USER: ${TEMPO_USER}
      PROM_URL: ${PROM_URL}
      PROM_USER: ${PROM_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      # The Alloy image ships no wget/curl, but it does have bash — so we
      # open a raw TCP socket via /dev/tcp to Alloy's own HTTP server
      # (port 12345) and check the /-/ready endpoint returns 200 OK.
      # /-/ready reports healthy only once Alloy has loaded its config.

  node-exporter:
    image: prom/node-exporter:v1.9.1
    # Pinned — avoid :latest so a redeploy can't silently change versions.
    container_name: node-exporter
    restart: unless-stopped

    # Resource ceiling — node-exporter is tiny and stateless; the most
    # expendable thing here, so it's first in line for the OOM killer.
    oom_score_adj: 1000
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

    network_mode: host
    # host networking required — node_exporter needs to read the host's
    # /proc and /sys filesystems to report accurate system metrics.
    pid: host
    # Required for accurate per-process metrics.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # Excludes virtual filesystems so the dashboard isn't cluttered
      # with /proc, /sys, cgroup mounts etc.

    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      # node-exporter's busybox image has wget. Hit the landing page on
      # :9100 (returns 200 once serving) rather than /metrics, to avoid
      # triggering a full collector run on every check.

volumes:
  alloy_data:
    driver: local
