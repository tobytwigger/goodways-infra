services:

  # ─────────────────────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # Pinned to major version 7, alpine variant for smaller image size.
    # Avoid :latest so redeployments don't silently change version.

    container_name: redis
    restart: unless-stopped

    labels:
      - "app.name=redis"

    stop_grace_period: 1m
    # Give Redis up to 1 minute to flush its final RDB snapshot to disk
    # on shutdown before Docker sends SIGKILL. Protects against data loss
    # on redeploys. Redis treats the default SIGTERM as a clean shutdown.

    security_opt:
      - no-new-privileges:true
      # Hardening: the container can never gain new privileges via setuid
      # binaries. Safe here — the entrypoint only ever drops from root to
      # the unprivileged "redis" user, it never escalates.

    sysctls:
      net.core.somaxconn: 511
      # Raise the TCP accept backlog inside the container's net namespace.
      # Removes Redis's startup warning and prevents dropped connections
      # under bursty load. 511 is Redis's own recommended value.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
      # Cap container logs at 3 × 10MB so a noisy log can never fill the
      # host disk. Stays on json-file so Alloy can still tail it from
      # /var/lib/docker/containers.

    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru --save 60 1 --loglevel notice
    # --requirepass: password auth. Set REDIS_PASSWORD in Coolify env vars.
    # --maxmemory: cap memory usage. Defaults to 256mb if not set.
    # --maxmemory-policy allkeys-lru: when full, evict least recently used
    #   keys. Correct for a cache. Use noeviction if Redis is a queue/store.
    # --save 60 1: persist to disk if at least 1 key changed in 60 seconds.
    #   Gives basic durability without performance impact.
    # --loglevel notice: logs important events without being too verbose.

    ports:
      - "127.0.0.1:6379:6379"
      # Loopback only — Redis should never be publicly accessible.
      # Your Laravel API reaches Redis via the internal Docker network
      # using the container name "redis", not this host port.
      # This host port binding is only needed if you want to connect
      # from the host itself (e.g. for debugging with redis-cli).

    volumes:
      - redis_data:/data
      # Persists RDB snapshots (from --save above) across redeployments.

    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      # redis-cli ping returns PONG when Redis is ready.
      # --no-auth-warning suppresses the stderr warning that -a otherwise
      # prints on every check. The exporter below depends_on this check.

    networks:
      - redis_network
      - coolify

  # ─────────────────────────────────────────────────────────────
  # REDIS EXPORTER
  # Exposes Redis metrics in Prometheus format on port 9121.
  # Alloy (running with host networking on the same server) scrapes
  # localhost:9121 and ships metrics to Grafana Cloud.
  # Docs: https://github.com/oliver006/redis_exporter
  # ─────────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    # Pinned version — avoid :latest so a redeploy can't silently pull a
    # breaking exporter change. Bump deliberately.
    container_name: redis-exporter
    restart: unless-stopped

    # Resource ceiling — the exporter is sacrificial telemetry. If it's
    # OOM-killed you lose Redis metrics, but Redis itself (no limits, default
    # OOM score) keeps running. That's the intended trade.
    oom_score_adj: 1000
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      REDIS_ADDR: redis://redis:6379
      # "redis" resolves to the Redis container above via the shared
      # Docker network. No need for an IP address.

      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Same password as Redis. Set in Coolify env vars.

      REDIS_EXPORTER_LOG_FORMAT: json
      # Structured JSON logs so Alloy can parse them cleanly.

    ports:
      - "127.0.0.1:9121:9121"
      # Loopback only. Alloy scrapes this on localhost:9121.

    depends_on:
      redis:
        condition: service_healthy
    # Wait for Redis to be healthy before starting the exporter.
    # Without this, the exporter can start before Redis is ready
    # and exit with a connection error.

    networks:
      - redis_network
      - coolify

networks:
  redis_network:
    driver: bridge
    # Isolated network for Redis and its exporter.
    # Nothing else can reach Redis by container name except
    # services explicitly added to this network.
    # Your Laravel API will connect via the exposed host port
    # or you can attach it to this network in its own compose file.
  coolify:
    external: true

volumes:
  redis_data:
    driver: local
