services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    env_file: ./.env
    environment:
      SERVICE_FQDN_OUTLINE: ${SERVICE_FQDN_OUTLINE}
      # Coolify magic var — set this service's domain in the Coolify UI.
      # Coolify's proxy (fronted by your Cloudflare Tunnel) then routes to
      # this container and terminates TLS, so no https-portal container
      # is needed here.
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@outline-postgres:5432/outline
      # Coolify magic vars — auto-generates strong random Postgres
      # credentials on first deploy, shared with the postgres service
      # below via the same var names. Set here (not in .env) because
      # env_file entries are loaded literally by Docker and don't get
      # ${...} substituted — only docker-compose.yml's own environment:
      # block does. This overrides the plain env_file DATABASE_URL.
      #
      # Hostname is "outline-postgres" — the postgres service's key name
      # below, which is what Docker actually registers as the network
      # alias (container_name is cosmetic; Coolify overrides real container
      # names with its own scheme, so it never produces a resolvable DNS
      # entry). This container also sits on the shared external "coolify"
      # network (for Traefik routing), which other stacks in this repo also
      # join with their own services keyed "postgres"/"redis" — a generic
      # service-key alias is ambiguous across that shared network; a
      # unique key name isn't.
    ports:
      - "127.0.0.1:${FORWARD_OUTLINE_PORT:-3000}:${PORT:-3000}"
      # Loopback only — public traffic comes via the Coolify proxy above,
      # not this binding. This is just for local/debug access. Override
      # FORWARD_OUTLINE_PORT in .env if the default is already taken on
      # the host.
    volumes:
      - storage-data:/var/lib/outline/data
    depends_on:
      - outline-postgres
      - outline-redis
    networks:
      - default
      - coolify
      # "coolify" is the external network Coolify's Traefik proxy is on.
      # Without it, Traefik has no path to this container even though it
      # generates a router for it from SERVICE_FQDN_OUTLINE — requests to
      # docs.goodways.org 404 as if no route exists at all.

  outline-redis:
    image: redis
    container_name: outline-redis
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
      # Loopback only — Outline reaches Redis via the internal Docker
      # network using the service key "outline-redis" (see REDIS_URL in
      # .env). Override FORWARD_REDIS_PORT in .env if 6379 is already
      # taken on the host.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3

  outline-postgres:
    image: postgres:18
    container_name: outline-postgres
    restart: unless-stopped
    env_file: ./.env
    expose:
      - "5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d outline -U \"$$POSTGRES_USER\""]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: "outline"

networks:
  coolify:
    external: true

volumes:
  storage-data:
  database-data:
