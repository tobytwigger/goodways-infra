services:
  wordpress:
    image: "wordpress:latest"
    ports:
      - "127.0.0.1:${WORDPRESS_PORT}:80"
      # WORDPRESS_PORT comes from .env. Plain ${VAR} — not ${VAR:-8081}, as the
      # default-value form is what threw "Invalid interpolation format".
      # Loopback only — public traffic still comes via the Coolify proxy using
      # SERVICE_FQDN_WORDPRESS. Drop the 127.0.0.1: prefix to expose publicly.
    volumes:
      - "wordpress-files:/var/www/html"
    environment:
      SERVICE_URL_WORDPRESS: $SERVICE_URL_WORDPRESS
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: $SERVICE_USER_WORDPRESS
      WORDPRESS_DB_PASSWORD: $SERVICE_PASSWORD_WORDPRESS
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      - mysql
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://127.0.0.1/healthz"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    container_name: wordpress-goodways
    networks:
      wordpress: null
    env_file:
      - .env
  mysql:
    image: "mysql:8"
    volumes:
      - "wordpress-mysql-data:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: $SERVICE_PASSWORD_ROOT
      MYSQL_DATABASE: wordpress
      MYSQL_USER: $SERVICE_USER_WORDPRESS
      MYSQL_PASSWORD: $SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-h"
        - 127.0.0.1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    container_name: wordpress-mysql
    networks:
      wordpress: null
    env_file:
      - .env

volumes:
  wordpress-files:
    name: wordpress-files
  wordpress-mysql-data:
    name: wordpress-mysql-data
networks:
  wordpress:
    name: wordpress
